<body>
  <main>
    <header><h1>独立与情境登录</h1><a href="../docs/specifications/DIALOGS.md">设计规范</a></header>
    <section aria-label="当前主题渲染样例" class="samples">
      <figure><a href="../assets/blueprints/baseline-auth-desktop.jpg"><img src="../assets/blueprints/baseline-auth-desktop.jpg" alt="桌面独立登录"></a><figcaption>桌面独立登录</figcaption></figure>
      <figure><a href="../assets/blueprints/baseline-auth-mobile.jpg"><img src="../assets/blueprints/baseline-auth-mobile.jpg" alt="手机情境登录面板"></a><figcaption>手机情境登录面板</figcaption></figure>
    </section>
    <dl>
      <div><dt>登录与恢复</dt><dd>账号、密码以及找回入口遵守相同的触控尺寸。独立登录支持直接访问，情境登录保留原任务。</dd></div>
      <div><dt>会话核验</dt><dd>登录成功后显示身份刷新状态。刷新失败提供重新检查、取消、前往完整登录页；会话失效后保留账号并允许重新输入密码。</dd></div>
    </dl>
  </main>
