<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LoveCards · 发现与搜索</title>
  <link rel="stylesheet" href="./runtime-board.css">
</head>
<body>
  <main>
    <header><h1>发现与搜索</h1><a href="../docs/specifications/SEARCH.md">设计规范</a></header>
    <section aria-label="当前主题渲染样例" class="samples">
      <figure><a href="../assets/blueprints/baseline-explore-desktop.jpg"><img src="../assets/blueprints/baseline-explore-desktop.jpg" alt="发现频道信息流"></a><figcaption>发现频道信息流</figcaption></figure>
      <figure><a href="../assets/blueprints/baseline-search-mobile.jpg"><img src="../assets/blueprints/baseline-search-mobile.jpg" alt="搜索内容结果"></a><figcaption>搜索内容结果</figcaption></figure>
      <figure><a href="../assets/blueprints/baseline-search-entry-mobile.jpg"><img src="../assets/blueprints/baseline-search-entry-mobile.jpg" alt="手机搜索入口"></a><figcaption>手机搜索入口</figcaption></figure>
      <figure><a href="../assets/blueprints/baseline-topic-mobile.jpg"><img src="../assets/blueprints/baseline-topic-mobile.jpg" alt="手机话题详情"></a><figcaption>手机话题详情</figcaption></figure>
    </section>
    <dl>
      <div><dt>发现</dt><dd>桌面用侧栏切换频道，手机在居中顶栏切换。内容工具行提供排序，手机还可切换单列与多列。工具行下方直接显示卡片流。</dd></div>
      <div><dt>搜索与话题</dt><dd>手机搜索与话题使用和设置一致的返回顶栏。搜索范围保留关键词，话题返回原搜索结果或发现。桌面卡片流固定多列，手机沿用浏览器记住的单列／多列选择。结果行允许长名称换行。</dd></div>
    </dl>
  </main>
</body>
</html>
