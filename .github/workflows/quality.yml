name: Quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NUXT_PUBLIC_APP_ENV: production
      NUXT_PUBLIC_API_BASE: /api
      LC_TEST_DB_HOST: 127.0.0.1
      LC_TEST_DB_PORT: '3306'
      LC_TEST_DB_USER: root
      LC_TEST_DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
      - run: npm ci
      - run: composer validate --no-check-publish
        working-directory: apps/backend
      - run: composer install --no-interaction --prefer-dist --no-progress
        working-directory: apps/backend
      - run: npm run check
      - run: npm run build:admin
      - run: npm run generate:admin
      - run: npm run check:sdk-theme

  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.1', '8.2']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      LC_TEST_DB_HOST: 127.0.0.1
      LC_TEST_DB_PORT: '3306'
      LC_TEST_DB_USER: root
      LC_TEST_DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo_mysql, zip, gd
          tools: composer:v2
      - run: composer validate --no-check-publish
        working-directory: apps/backend
      - run: composer install --no-interaction --prefer-dist --no-progress
        working-directory: apps/backend
      - run: npm run test:backend
      - run: find app config tests -name '*.php' -print0 | xargs -0 -n1 php -l
        working-directory: apps/backend

  integration:
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NUXT_PUBLIC_APP_ENV: production
      NUXT_PUBLIC_API_BASE: /api
      # mysqlnd 与 charset=utf8mb4 握手时连接 collation 固定为 utf8mb4_general_ci，
      # 而 mysql:8.0 上建的 utf8mb4 表是 0900_ai_ci；迁移里 UNION 派生表列与表列
      # 对比会抛 Illegal mix of collations，这里显式对齐（见 config/database.php；
      # ThinkPHP env() 只读 PHP_ 前缀，故键名是 PHP_DATABASE_COLLATION）。
      PHP_DATABASE_COLLATION: utf8mb4_0900_ai_ci
      LOVECARDS_E2E_DB_HOST: 127.0.0.1
      LOVECARDS_E2E_DB_PORT: '3306'
      LOVECARDS_E2E_DB_USER: root
      LOVECARDS_E2E_DB_PASSWORD: root
      LOVECARDS_E2E_ADMIN_ACCOUNT: e2e-admin@example.test
      LOVECARDS_E2E_ADMIN_PASSWORD: '123456'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, zip, gd
          tools: composer:v2
      - run: npm ci
      - run: composer install --no-interaction --prefer-dist --no-progress
        working-directory: apps/backend
      - run: npx playwright install --with-deps chromium
      - run: npm run package:default-theme
      - name: Verify live E2E database collision guard
        run: npm run test:e2e:safety
        env:
          LOVECARDS_E2E_DB_SAFETY_LIVE: '1'
          LOVECARDS_E2E_DB_SAFETY_NAME: lovecards_e2e_collision_ci_${{ github.run_id }}_${{ github.run_attempt }}
      - name: Run SDK, Admin and Theme E2E in one isolated database
        run: npm run test:admin:e2e
        env:
          LOVECARDS_E2E_ISOLATED: '1'
          LOVECARDS_E2E_DB_NAME: lovecards_e2e_community_ci_${{ github.run_id }}_${{ github.run_attempt }}
          LOVECARDS_E2E_RUN_SDK_INTEGRATION: '1'
          LOVECARDS_E2E_RUN_THEME: '1'
      - name: Verify clean-install and migrated schemas match
        run: npm run test:schema:e2e
        env:
          LOVECARDS_SCHEMA_E2E_ISOLATED: '1'
      - name: Run signed system upgrade E2E
        run: npm run test:upgrade:e2e
        env:
          LOVECARDS_UPGRADE_E2E_ISOLATED: '1'
          LOVECARDS_UPGRADE_E2E_DB_NAME: lovecards_e2e_upgrade_ci_${{ github.run_id }}_${{ github.run_attempt }}
          LOVECARDS_UPGRADE_E2E_PORT: '16003'
      - run: npm run build
      - name: Upload integration failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            apps/admin/playwright-report/
            apps/admin/test-results/
            playwright-report/
            test-results/
            packages/sdk/test/TEST_REPORT.md

  backend-gate:
    name: backend
    needs: backend
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.backend.result }}" = "success"
