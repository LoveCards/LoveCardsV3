    @media(max-width:620px){.sheet-head{padding:17px 16px}.sheet-body{padding:18px 16px 24px;gap:18px}.sheet-grid{grid-template-columns:1fr;gap:18px}.sheet-image{display:block}.sheet-image .art{width:min(100%,300px)}.sheet-image__actions{margin-top:10px}.media-grid{grid-template-columns:repeat(auto-fill,minmax(145px,1fr))}.sheet-confirm{display:block}.sheet-confirm__actions{margin-top:10px}.dialog .sheet-body{padding:18px 16px 24px;gap:18px}.dialog .sheet-actions{margin:0 -16px -24px;padding:13px 16px}}

<body>
  <div class="reviewbar"><div class="reviewbar__name">详情双形态 · 设计原型</div><div class="reviewbar__controls"><button id="show-detail" type="button" aria-pressed="true">引用入口 → 独立页面</button><button id="show-list" type="button" aria-pressed="false">主列表 → 编辑弹窗</button><button id="theme-toggle" type="button" aria-pressed="false">深色模式</button><span class="reviewbar__note">示例数据 · 交互仅供审查</span></div></div>
  <div class="app">
    <aside class="sidebar" aria-label="管理导航"><div class="brand"><span class="brand__mark">♥</span><span class="brand__text">LoveCards 管理台</span></div><div class="nav-label">内容运营</div><a class="nav-item" href="#" onclick="return false"><span class="icon">▦</span><span>工作台</span></a><a class="nav-item active" href="#" onclick="return false"><span class="icon">▤</span><span>卡片管理</span></a><a class="nav-item" href="#" onclick="return false"><span class="icon">☰</span><span>评论管理</span></a><a class="nav-item" href="#" onclick="return false"><span class="icon">◇</span><span>标签管理</span></a><div class="nav-label">社区治理</div><a class="nav-item" href="#" onclick="return false"><span class="icon">⚑</span><span>举报处理</span></a></aside>
    <div class="shell"><header class="topbar"><div class="topbar__left">内容运营 <span class="quiet">/ 管理</span></div><div class="topbar__right"><span class="quiet">开发环境</span><span class="avatar">管</span></div></header><main id="main" class="content content--detail"></main></div>
  </div>
  <div id="overlay" class="overlay" aria-hidden="true"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="dialog__head"><div><h2 id="dialog-title" class="dialog__title" tabindex="-1">编辑卡片 · #38472</h2><p class="dialog__caption">卡片列表 · 当前记录</p></div><button id="close-dialog" class="btn btn--icon" type="button" aria-label="关闭弹窗">×</button></div><div id="dialog-body" class="dialog__body"></div><div id="dialog-footer" class="dialog__footer"><button class="btn btn--text" data-action="cancel" data-scope="modal" type="button">取消</button><button class="btn btn--primary" data-action="save" data-scope="modal" type="button">保存修改</button></div><div id="guard" class="guard hidden"><span>有未保存的修改。关闭后会放弃这些修改。</span><div class="guard__actions"><button id="keep-editing" class="btn btn--outline" type="button">继续编辑</button><button id="discard-editing" class="btn btn--text" type="button">放弃修改</button></div></div></div></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
    const tagCatalog=[{id:28,name:'随笔'},{id:12,name:'日常'},{id:9,name:'阅读'},{id:34,name:'城市'},{id:41,name:'摄影'},{id:52,name:'心情'}];
    const initial={body:'城市安静下来以后，窗边还有一盏灯亮着。它并不特别明亮，却足够让晚归的人知道，前面有可以停留的地方。\n\n这是今天收藏的一段文字。想把它留在这里，也留给需要的人。',tagIds:[28],status:3,visibility:'public',pinned:false,media:[{id:'sample-1',name:'城市窗景.jpg',url:null}],coverId:'sample-1',data:{source:'用户发布',location:{city:'杭州',district:'西湖区'},topics:['夜晚','城市'],metadata:{language:'zh-CN',original:true}}};
    const record={...initial};
    const state={screen:'detail',modal:false,pageMode:'view',modalMode:'edit',draft:null,dirty:false,guard:false,pendingCommand:null};
    const main=document.getElementById('main'),overlay=document.getElementById('overlay'),dialogBody=document.getElementById('dialog-body'),guard=document.getElementById('guard');
    const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const tagLabel=id=>{const tag=tagCatalog.find(item=>item.id===id);return tag?`${tag.name} #${id}`:`标签 #${id}`};
    const copyDraft=()=>({body:record.body,tagIds:[...record.tagIds],visibility:record.visibility,media:record.media.map(item=>({...item})),coverId:record.coverId,dataText:JSON.stringify(record.data,null,2)});
    const mediaSignature=value=>value.media.map(item=>item.id).join(',')+'|'+value.coverId;
    function renderKeepingScroll(){const pageY=scrollY,dialogY=dialogBody.scrollTop;render();scrollTo(0,pageY);dialogBody.scrollTop=dialogY}
    function tagOptions(query,selected){const normalized=query.trim().toLocaleLowerCase();const options=tagCatalog.filter(item=>!selected.includes(item.id)&&(item.name.toLocaleLowerCase().includes(normalized)||String(item.id).includes(normalized)));return options.length?options.map(item=>`<button class="tag-option" data-action="add-tag" data-id="${item.id}" type="button">＋ ${escapeHtml(tagLabel(item.id))}</button>`).join(''):'<span class="tag-picker__empty">没有匹配的可选标签</span>'}
    function mediaCard(item,index,media,coverId,edit){return `<div class="media-card"><div class="media-card__preview">${item.url?`<img src="${escapeHtml(item.url)}" alt="${escapeHtml(item.name)}">`:art()}${item.id===coverId?'<span class="media-card__cover">封面</span>':''}</div><div class="media-card__info" title="${escapeHtml(item.name)}">${index+1}. ${escapeHtml(item.name)}</div>${edit?`<div class="media-card__actions"><button class="btn btn--text" data-action="move-image" data-id="${escapeHtml(item.id)}" data-direction="-1" type="button" aria-label="上移 ${escapeHtml(item.name)}" ${index===0?'disabled':''}>↑ 上移</button><button class="btn btn--text" data-action="move-image" data-id="${escapeHtml(item.id)}" data-direction="1" type="button" aria-label="下移 ${escapeHtml(item.name)}" ${index===media.length-1?'disabled':''}>↓ 下移</button>${item.id===coverId?'':`<button class="btn btn--text" data-action="set-cover" data-id="${escapeHtml(item.id)}" type="button">设封面</button>`}<button class="btn btn--text" data-action="remove-image" data-id="${escapeHtml(item.id)}" type="button">移除</button></div>`:''}</div>`}
    function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2600)}
    function art(){return `<div class="art" aria-label="卡片封面示意图"><svg viewBox="0 0 600 360" role="img" aria-label="暮色下的城市窗景"><rect width="600" height="360" fill="#dbe1e8"/><rect y="234" width="600" height="126" fill="#b7c2ce"/><path d="M0 264 121 208 212 257 320 190 443 249 600 194v166H0Z" fill="#8e9da9"/><path d="M0 302 140 258 253 297 361 241 477 294 600 244v116H0Z" fill="#667888"/><rect x="386" y="115" width="112" height="245" fill="#495969"/><rect x="402" y="135" width="28" height="34" fill="#ecd59b"/><rect x="451" y="135" width="28" height="34" fill="#96a9b6"/><rect x="402" y="194" width="28" height="34" fill="#96a9b6"/><rect x="451" y="194" width="28" height="34" fill="#ecd59b"/><rect x="402" y="252" width="28" height="34" fill="#96a9b6"/><rect x="451" y="252" width="28" height="34" fill="#96a9b6"/><circle cx="92" cy="69" r="21" fill="#f7e7bd" opacity=".86"/></svg></div>`}
    function detailBody(mode,scope){
      const edit=mode==='edit';
      const draft=state.draft??record;
      const statusNames={0:'正常发布',1:'已封禁',2:'已隐藏',3:'待审核'};
      const visibilityNames={public:'公开',followers:'仅关注者',private:'仅自己'};
      const locked=(label,value,link=false)=>`<div class="sheet-field"><div class="sheet-field__label">${label}<span class="lock-mark" aria-label="锁定只读">🔒</span></div><div class="sheet-locked ${link?'sheet-locked--link':''}">${value}</div></div>`;
      const editable=(label,value,control)=>`<div class="sheet-field"><div class="sheet-field__label">${label}</div>${edit?control:`<div class="sheet-read">${value}</div>`}</div>`;
      const picture=`<div class="media-grid">${draft.media.map((item,index)=>mediaCard(item,index,draft.media,draft.coverId,edit)).join('')}${edit?'<button class="media-add" data-action="add-image" type="button"><strong>＋ 添加图片</strong><span>可一次选择多张</span></button>':''}</div>${edit?'<input class="hidden" data-field="image-file" type="file" accept="image/*" multiple aria-label="选择多张图片">':''}<p class="media-summary">${draft.media.length} 张图片${draft.media.length?' · 首张为默认顺序，封面可单独指定':''}${edit?' · 原型仅在浏览器预览，不上传服务器':''}</p>`;
      return `<article class="record record--unified" data-scope="${scope}">
        ${scope==='page'?`<div class="sheet-head"><strong class="sheet-head__identity">卡片 #38472</strong>${!edit?'<button class="btn btn--outline btn--small" data-action="edit" type="button">编辑</button>':''}</div>`:''}
        <div class="sheet-body">
          ${editable('正文',escapeHtml(record.body).replaceAll('\n','<br>'),`<textarea id="body-${scope}" class="form-input form-input--body" data-field="body">${escapeHtml(draft.body)}</textarea>`)}
          <div class="sheet-field"><div class="sheet-field__label">图片</div>${picture}</div>
          <div class="sheet-grid">
            ${editable('标签',record.tagIds.length?record.tagIds.map(id=>`<span class="tag">${escapeHtml(tagLabel(id))}</span>`).join(' '):'无标签',`<div class="tag-picker"><div class="tag-picker__selected">${draft.tagIds.map(id=>`<span class="tag-chip">${escapeHtml(tagLabel(id))}<button data-action="remove-tag" data-id="${id}" type="button" aria-label="移除 ${escapeHtml(tagLabel(id))}">×</button></span>`).join('')}</div><input id="tag-${scope}" class="tag-picker__search" data-field="tag-search" type="search" autocomplete="off" placeholder="搜索名称或编号并选择" aria-label="搜索标签"><div class="tag-picker__results" data-tag-results>${tagOptions('',draft.tagIds)}</div></div><p class="sheet-field__hint">按名称或 ID 搜索；示例候选仅用于原型。</p>`)}
            ${editable('发布范围',visibilityNames[record.visibility],`<select class="form-input sheet-select" data-field="visibility" aria-label="发布范围"><option value="public" ${draft.visibility==='public'?'selected':''}>公开</option><option value="followers" ${draft.visibility==='followers'?'selected':''}>仅关注者</option><option value="private" ${draft.visibility==='private'?'selected':''}>仅自己</option></select>`)}
          </div>
          <div class="sheet-field"><div class="sheet-field__label">扩展数据 · JSON</div>${edit?`<textarea class="form-input sheet-json" data-field="dataText" spellcheck="false" aria-label="扩展数据 JSON" aria-describedby="json-help-${scope} json-error-${scope}">${escapeHtml(draft.dataText)}</textarea><p id="json-help-${scope}" class="sheet-field__hint">完整 JSON 对象；保存前校验格式。原型演示编辑能力，正式管理端尚待接入。</p><p id="json-error-${scope}" class="sheet-error hidden" role="alert"></p>`:`<div class="sheet-read sheet-read--multiline">${escapeHtml(JSON.stringify(record.data,null,2))}</div>`}</div>
          <div class="sheet-grid">
            <div class="sheet-field"><div class="sheet-field__label">审核与发布状态</div><select class="form-input sheet-select sheet-select--command" data-command="status" aria-label="审核与发布状态"><option value="none" selected>${statusNames[record.status]}</option>${record.status===3?'<option value="approve">通过审核并发布</option>':''}${record.status===0?'<option value="hide">隐藏卡片</option><option value="ban">封禁卡片</option>':''}${record.status===2?'<option value="unhide">取消隐藏并发布</option>':''}${record.status===1?'<option value="unban">解除封禁并发布</option>':''}</select><p class="sheet-field__hint">状态变更会立即生效，需单独确认。</p></div>
            <div class="sheet-field"><div class="sheet-field__label">置顶状态</div><select class="form-input sheet-select sheet-select--command" data-command="pin" aria-label="置顶状态" ${record.status!==0?'disabled':''}><option value="none" selected>${record.pinned?'已置顶':'未置顶'}</option><option value="toggle">${record.pinned?'取消置顶':'置顶卡片'}</option></select><p class="sheet-field__hint">${record.status===0?'单独确认后生效':'审核通过后才可置顶'}</p></div>
          </div>
          ${state.pendingCommand?`<div class="sheet-confirm" role="alert"><span>确定执行“${state.pendingCommand.label}”吗？这项操作立即生效，不随内容保存一起提交。</span><div class="sheet-confirm__actions"><button class="btn btn--text btn--small" data-action="cancel-command" type="button">取消</button><button class="btn btn--primary btn--small" data-action="confirm-command" type="button">确认${state.pendingCommand.label}</button></div></div>`:''}
          <div class="sheet-grid sheet-grid--meta">
            ${locked('作者','<a href="#" data-action="reference">林间来信 #48 ↗</a>',true)}
            ${locked('发布时间','2026-11-18 21:36')}
            ${locked('数据统计','126 赞 · 18 评论 · 2,430 浏览')}
          </div>
          ${edit&&scope==='page'?`<div class="sheet-actions"><button class="btn btn--text" data-action="cancel" type="button">取消编辑</button><button class="btn btn--primary" data-action="save" type="button">保存修改</button></div>`:''}
        </div>
      </article>`;
    }    function detailPage(){main.className='content content--detail';main.innerHTML=`<nav class="breadcrumbs" aria-label="面包屑"><span>内容运营</span><span>›</span><a href="#" data-action="list">卡片管理</a><span>›</span><span>卡片 #38472</span></nav><div class="page-head"><div><h1>卡片详情</h1><p>来自评论 #2081 的关联引用</p></div><div class="page-head__actions"><button class="btn btn--outline" data-action="return-reference" type="button">← 返回评论 #2081</button></div></div>${detailBody(state.pageMode,'page')}`}
    function listPage(){main.className='content content--list';main.innerHTML=`<nav class="breadcrumbs" aria-label="面包屑"><span>内容运营</span><span>›</span><span>卡片管理</span></nav><div class="page-head"><div><h1>卡片管理</h1><p>按状态处理卡片内容，当前列表操作保留查询上下文。</p></div><div class="page-head__actions"><button class="btn btn--outline" type="button" data-action="refresh">↻ 刷新</button></div></div><div class="table-shell"><div class="table-tools"><label class="search"><span aria-hidden="true">⌕</span><input aria-label="搜索卡片" placeholder="搜索卡片内容或作者"></label><span class="quiet">共 3 条结果</span></div><div class="table-scroll"><table><thead><tr><th>内容</th><th>用户</th><th>标签</th><th>状态</th><th>发布时间</th><th class="actions">操作</th></tr></thead><tbody><tr><td><div class="table-title">${escapeHtml(record.body.split('。')[0]+'。')}</div><div class="table-sub">${escapeHtml(record.body.slice(0,32))}…</div></td><td>林间来信 #48</td><td>${record.tagIds.map(id=>escapeHtml(tagLabel(id))).join('、')||'—'}</td><td><span class="badge ${record.status===3?'badge--amber':'badge--green'}">${({0:'正常发布',1:'已封禁',2:'已隐藏',3:'待审核'})[record.status]}</span></td><td>2026-11-18 21:36</td><td class="actions"><button class="btn btn--text btn--small" data-action="open-modal" type="button">编辑</button><button class="btn btn--text btn--small" data-action="command" type="button">隐藏</button></td></tr><tr><td><div class="table-title">周末散步的路线</div><div class="table-sub">沿河走到旧桥，午后的风刚好…</div></td><td>北岸 #77</td><td>日常 #12</td><td><span class="badge badge--amber">待审核</span></td><td>2026-11-17 15:04</td><td class="actions"><button class="btn btn--text btn--small" data-action="open-modal" type="button">编辑</button><button class="btn btn--text btn--small" data-action="command" type="button">审核</button></td></tr><tr><td><div class="table-title">读完这本书以后</div><div class="table-sub">摘下几句话，留给以后再看…</div></td><td>清风 #103</td><td>阅读 #9</td><td><span class="badge badge--green">已发布</span></td><td>2026-11-16 09:32</td><td class="actions"><button class="btn btn--text btn--small" data-action="open-modal" type="button">编辑</button><button class="btn btn--text btn--small" data-action="command" type="button">隐藏</button></td></tr></tbody></table></div><div class="table-footer"><span>每页 20 条</span><span>1–3 / 3　‹　›</span></div></div><div class="reference"><strong>关联引用示例：</strong>在评论 #2081 中点击“所属卡片 · <a href="#" data-action="detail">卡片 #38472 ↗</a>”，进入上面的独立详情页。</div>`}
    function render(){if(state.screen==='detail')detailPage();else listPage();document.getElementById('show-detail').setAttribute('aria-pressed',String(state.screen==='detail'));document.getElementById('show-list').setAttribute('aria-pressed',String(state.screen==='list'));if(state.modal){dialogBody.innerHTML=detailBody(state.modalMode,'modal');document.getElementById('dialog-footer').classList.toggle('hidden',state.modalMode!=='edit');overlay.classList.add('open');overlay.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';document.getElementById('dialog-title').focus()}else{overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true');dialogBody.innerHTML='';document.body.style.overflow='';guard.classList.add('hidden')}}
    function setScreen(screen){if(state.modal)closeModal(true);state.screen=screen;state.pageMode='view';state.draft=null;state.dirty=false;render();window.scrollTo(0,0)}
    function openModal(trigger){state.modal=true;state.modalMode='edit';state.draft=copyDraft();state.dirty=false;state.trigger=trigger;render()}
    function closeModal(force=false){if(state.dirty&&!force){guard.classList.remove('hidden');document.getElementById('keep-editing').focus();return}state.modal=false;state.dirty=false;state.draft=null;render();state.trigger?.focus?.()}
    function edit(scope){state.draft=copyDraft();state.dirty=false;if(scope==='page')state.pageMode='edit';else state.modalMode='edit';render();document.querySelector(`[data-scope="${scope}"] [data-field="body"]`)?.focus()}
    function cancel(scope){if(scope==='modal'){closeModal();return}state.dirty=false;state.draft=null;state.pageMode='view';render()}
    function markDirty(){state.dirty=Boolean(state.draft&&(state.draft.body!==record.body||JSON.stringify(state.draft.tagIds)!==JSON.stringify(record.tagIds)||state.draft.visibility!==record.visibility||mediaSignature(state.draft)!==mediaSignature(record)||state.draft.dataText!==JSON.stringify(record.data,null,2)))}
    function applyCommand(){const command=state.pendingCommand;if(!command)return;switch(command.method){case 'approve':case 'unhide':case 'unban':record.status=0;break;case 'hide':record.status=2;break;case 'ban':record.status=1;break;case 'toggle':record.pinned=!record.pinned;break}state.pendingCommand=null;render();toast(command.label+'已执行（原型示意）')}
    function save(scope){if(!state.draft?.body.trim()){toast('正文不能为空');return}let parsed;const error=document.querySelector(`[data-scope="${scope}"] [id^="json-error-"]`);try{parsed=JSON.parse(state.draft.dataText);if(!parsed||Array.isArray(parsed)||typeof parsed!=='object')throw new Error('JSON 顶层必须是对象')}catch(cause){if(error){error.textContent=cause.message.startsWith('JSON 顶层')?cause.message:'JSON 格式不正确，请检查后再保存';error.classList.remove('hidden')}document.querySelector(`[data-scope="${scope}"] [data-field="dataText"]`)?.focus();return}Object.assign(record,{body:state.draft.body,tagIds:[...state.draft.tagIds],visibility:state.draft.visibility,media:state.draft.media.map(item=>({...item})),coverId:state.draft.coverId,data:parsed});state.dirty=false;state.draft=null;if(scope==='page'){state.pageMode='view';render()}else{state.modal=false;render();state.trigger?.focus?.()}toast('内容、标签、图片、JSON 与发布范围已保存（原型示意）')}
    document.getElementById('show-detail').addEventListener('click',()=>setScreen('detail'));
    document.getElementById('show-list').addEventListener('click',()=>{setScreen('list');openModal(document.getElementById('show-list'))});
    document.getElementById('theme-toggle').addEventListener('click',e=>{const on=document.body.classList.toggle('dark');e.currentTarget.setAttribute('aria-pressed',String(on));e.currentTarget.textContent=on?'浅色模式':'深色模式'});
    document.getElementById('close-dialog').addEventListener('click',()=>closeModal());
    document.getElementById('keep-editing').addEventListener('click',()=>{guard.classList.add('hidden');document.getElementById('dialog-title').focus()});
    document.getElementById('discard-editing').addEventListener('click',()=>closeModal(true));
    overlay.addEventListener('click',e=>{if(e.target===overlay)closeModal()});
    document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal){e.preventDefault();closeModal()}});
    document.addEventListener('click',e=>{const action=e.target.closest('[data-action]');if(!action)return;const name=action.dataset.action;const scope=action.dataset.scope||action.closest('[data-scope]')?.dataset.scope;if(action.tagName==='A')e.preventDefault();if(name==='edit')edit(scope);if(name==='cancel')cancel(scope);if(name==='save')save(scope);if(name==='open-modal'){if(action.closest('tr')?.rowIndex===1)openModal(action);else toast('本原型仅演示卡片 #38472')};if(name==='detail')setScreen('detail');if(name==='list')setScreen('list');if(name==='return-reference')toast('正式页面返回评论 #2081；原型仅演示卡片记录');if(name==='refresh')toast('示例数据已刷新');if(name==='command')toast('治理命令在正式页面按权限和状态执行');if(name==='reference')toast('正式页面会进入用户 #48 的独立详情页');if(name==='add-tag'&&state.draft){const id=Number(action.dataset.id);if(!state.draft.tagIds.includes(id)){state.draft.tagIds.push(id);markDirty();renderKeepingScroll();document.querySelector(`[data-scope="${scope}"] [data-field="tag-search"]`)?.focus()}}if(name==='remove-tag'&&state.draft){state.draft.tagIds=state.draft.tagIds.filter(id=>id!==Number(action.dataset.id));markDirty();renderKeepingScroll();document.querySelector(`[data-scope="${scope}"] [data-field="tag-search"]`)?.focus()}if(name==='add-image')action.closest('[data-scope]')?.querySelector('[data-field="image-file"]')?.click();if(name==='remove-image'&&state.draft){state.draft.media=state.draft.media.filter(item=>item.id!==action.dataset.id);if(state.draft.coverId===action.dataset.id)state.draft.coverId=state.draft.media[0]?.id??null;markDirty();renderKeepingScroll()}if(name==='set-cover'&&state.draft){state.draft.coverId=action.dataset.id;markDirty();renderKeepingScroll()}if(name==='move-image'&&state.draft){const index=state.draft.media.findIndex(item=>item.id===action.dataset.id),next=index+Number(action.dataset.direction);if(index>=0&&next>=0&&next<state.draft.media.length){[state.draft.media[index],state.draft.media[next]]=[state.draft.media[next],state.draft.media[index]];markDirty();renderKeepingScroll()}}if(name==='cancel-command'){state.pendingCommand=null;renderKeepingScroll()}if(name==='confirm-command')applyCommand()});
    document.addEventListener('input',e=>{if(e.target.matches('[data-field="tag-search"]')&&state.draft){e.target.closest('.tag-picker').querySelector('[data-tag-results]').innerHTML=tagOptions(e.target.value,state.draft.tagIds);return}if(!e.target.matches('[data-field="body"],[data-field="dataText"],[data-field="visibility"]')||!state.draft)return;state.draft[e.target.dataset.field]=e.target.value;if(e.target.dataset.field==='dataText')e.target.parentElement.querySelector('.sheet-error')?.classList.add('hidden');markDirty()});
    document.addEventListener('change',e=>{const command=e.target.closest('[data-command]');if(command){if(command.value==='none')return;if(state.dirty){command.value='none';toast('请先保存正文、标签、图片、JSON 和发布范围，再执行状态命令');return}const label=command.options[command.selectedIndex].textContent;state.pendingCommand={method:command.value,label};renderKeepingScroll();return}if(e.target.matches('[data-field="image-file"]')&&e.target.files?.length&&state.draft){const files=[...e.target.files],images=files.filter(file=>file.type.startsWith('image/'));if(images.length!==files.length)toast('已跳过非图片文件');for(const file of images){const id=`local-${Date.now()}-${Math.random().toString(36).slice(2)}`;state.draft.media.push({id,name:file.name,url:URL.createObjectURL(file)});if(!state.draft.coverId)state.draft.coverId=id}markDirty();renderKeepingScroll()}else if(e.target.matches('[data-field="visibility"]')&&state.draft){state.draft.visibility=e.target.value;markDirty()}});
    const previewParams=new URLSearchParams(location.search);
    if(previewParams.get('theme')==='dark'){document.body.classList.add('dark');const themeButton=document.getElementById('theme-toggle');themeButton.setAttribute('aria-pressed','true');themeButton.textContent='浅色模式'}
    if(previewParams.get('mode')==='modal'){state.screen='list';state.modal=true;state.modalMode='edit';state.draft=copyDraft()}
    render();
  </script>
</body>
</html>
